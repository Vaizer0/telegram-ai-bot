name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_NAME: ${{ secrets.RAILWAY_SERVICE_NAME }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "Skipping deploy: RAILWAY_TOKEN secret is not set."
            echo "Add it in GitHub > Settings > Secrets and variables > Actions."
            exit 0
          fi
          npx -y @railway/cli@latest up \
            --ci \
            --detach \
            ${RAILWAY_PROJECT_ID:+--project "$RAILWAY_PROJECT_ID"} \
            ${RAILWAY_SERVICE_NAME:+--service "$RAILWAY_SERVICE_NAME"}

services:
  - type: web
    name: telegram-ai-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    # The bot exposes a tiny HTTP endpoint on $PORT (see bot.py keep-alive
    # server) so Render's health check passes and the free tier stays awake.
    healthCheckPath: /ping
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: AI_BASE_URL
        value: https://opencode.ai/zen/v1
      - key: AI_API_KEY
        value: public
      - key: AI_MODEL
        value: big-pickle
